# Configuração do servidor tmux dedicado do oma-docker. Não toca no tmux pessoal.
set -g prefix C-q
unbind C-b
bind C-q send-prefix
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g focus-events on
set -g base-index 1
set -g renumber-windows on
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g status-left ""
set -g status-right " Alt+q volta ao oma-docker | Alt+n/p janelas "
set -g status-right-length 80
set -g window-status-current-style "bold,fg=colour2"
set -g allow-rename off
set -g set-clipboard on
bind -n M-q detach-client
bind -n M-n next-window
bind -n M-p previous-window
